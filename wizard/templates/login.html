{% extends "base.html" %}
{% block title %}Login — ScooPilot Voice Wizard{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">ScooPilot Wizard</h1>
    <p class="login-subtitle">Enter your admin key to continue.</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next }}"/>
      <div class="form-group">
        <label for="admin_key">Admin Key</label>
        <input
          type="password"
          id="admin_key"
          name="admin_key"
          class="form-control"
          placeholder="Enter admin key"
          autofocus
          required
        />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>
</div>

<style>
.login-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  padding: 2rem;
}
.login-card {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.login-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: .25rem;
  color: #1a202c;
}
.login-subtitle {
  color: #718096;
  font-size: .9rem;
  margin-bottom: 1.5rem;
}
.form-group {
  margin-bottom: 1rem;
}
.form-group label {
  display: block;
  font-size: .85rem;
  font-weight: 600;
  margin-bottom: .4rem;
  color: #2d3748;
}
.form-control {
  width: 100%;
  padding: .55rem .75rem;
  border: 1px solid #cbd5e0;
  border-radius: 6px;
  font-size: .95rem;
  box-sizing: border-box;
  outline: none;
  transition: border-color .15s;
}
.form-control:focus {
  border-color: #4299e1;
}
.btn-block {
  display: block;
  width: 100%;
  margin-top: 1.25rem;
}
.alert {
  padding: .65rem .9rem;
  border-radius: 6px;
  font-size: .875rem;
  margin-bottom: 1rem;
}
.alert-error {
  background: #fff5f5;
  border: 1px solid #feb2b2;
  color: #c53030;
}
</style>
{% endblock %}
